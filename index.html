<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Game</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #10131a;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Issue #204: blurs+dims the board behind a full-board overlay (attack
         menu, board-wide shortcut menu) to match docs/mockups/03-commander-
         damage.html's depth-of-field treatment. No transition, so the effect
         is removed instantly (no flash/pop) when the overlay closes. */
      canvas.board-blurred {
        filter: blur(2px) brightness(0.4);
      }
      button {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
